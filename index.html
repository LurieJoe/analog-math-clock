<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const saved = localStorage.getItem("equation-clock-theme") || "system";
        const preference = param || saved;
        const theme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <title>Math Clock</title>
    <meta
      name="description"
      content="Customizable analog clocks with randomized mathematical equations and selectable time zones."
    />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Math Clock" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="clock-stage" aria-label="Equation clocks">
        <header class="app-header">
          <div>
            <p class="eyebrow">World time</p>
            <h1>Math Clock</h1>
          </div>
          <div class="top-actions">
            <button class="icon-button" id="add-clock-button" type="button">
              <span aria-hidden="true">＋</span>
              <span>Add clock</span>
            </button>
            <button class="icon-button install-button" id="install-button" type="button" hidden>
              <span aria-hidden="true">↓</span>
              <span>Install</span>
            </button>
          </div>
        </header>

        <div class="clocks-grid" id="clocks-grid"></div>
      </section>

      <aside class="settings-panel" id="settings-panel" aria-label="Clock customization" hidden>
        <div class="settings-heading">
          <div>
            <p class="eyebrow">Clock settings</p>
            <h2>Customize this clock</h2>
          </div>
          <button class="close-button" id="close-settings" type="button" aria-label="Close settings">
            ×
          </button>
        </div>

        <form id="settings-form">
          <fieldset>
            <legend>Clock details</legend>
            <label>
              Name
              <input id="clock-name" name="name" type="text" maxlength="40" required />
            </label>
            <label>
              Time zone
              <select id="time-zone" name="timeZone"></select>
            </label>
            <label>
              App appearance
              <select id="theme-preference" name="themePreference">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </label>
          </fieldset>

          <fieldset>
            <legend>Clock design</legend>
            <label>
              Clock body
              <select id="body-style" name="bodyStyle">
                <option value="wall">Standard wall clock</option>
                <option value="grandfather">Grandfather clock</option>
                <option value="cuckoo">Cuckoo clock</option>
                <option value="alarm">Bell alarm clock</option>
              </select>
            </label>
            <label>
              Frame shape
              <select id="face-shape" name="faceShape">
                <option value="round">Round</option>
                <option value="square">Rounded square</option>
                <option value="octagon">Octagon</option>
                <option value="arch">Arch</option>
              </select>
            </label>
          </fieldset>

          <fieldset>
            <legend>Clock face</legend>
            <label>
              Face color
              <input id="face-color" name="faceColor" type="color" />
            </label>
            <label>
              Rim color
              <input id="rim-color" name="rimColor" type="color" />
            </label>
            <label>
              Equation color
              <input id="equation-color" name="equationColor" type="color" />
            </label>
            <label>
              Equation size
              <input id="equation-size" name="equationSize" type="range" min="22" max="40" step="1" />
            </label>
            <label class="checkbox-label">
              <input id="show-ticks" name="showTicks" type="checkbox" />
              Show minute marks
            </label>
          </fieldset>

          <fieldset>
            <legend>Face picture</legend>
            <label class="file-label">
              Picture
              <input id="face-picture" name="facePicture" type="file" accept="image/*" />
            </label>
            <label>
              Horizontal position
              <input
                id="photo-position-x"
                name="photoPositionX"
                type="range"
                min="-50"
                max="50"
                step="1"
              />
            </label>
            <label>
              Vertical position
              <input
                id="photo-position-y"
                name="photoPositionY"
                type="range"
                min="-50"
                max="50"
                step="1"
              />
            </label>
            <label>
              Picture zoom
              <input id="photo-zoom" name="photoZoom" type="range" min="100" max="250" step="5" />
            </label>
            <label>
              Picture opacity
              <input
                id="photo-opacity"
                name="photoOpacity"
                type="range"
                min="20"
                max="100"
                step="5"
              />
            </label>
            <label>
              Readability overlay
              <input
                id="photo-overlay"
                name="photoOverlay"
                type="range"
                min="0"
                max="90"
                step="5"
              />
            </label>
            <button id="remove-picture-button" class="secondary-button" type="button">
              Remove picture
            </button>
          </fieldset>

          <fieldset>
            <legend>Clock hands</legend>
            <label>
              Hand style
              <select id="hand-style" name="handStyle">
                <option value="round">Rounded</option>
                <option value="square">Squared</option>
                <option value="tapered">Tapered</option>
              </select>
            </label>
            <label>
              Hour hand
              <input id="hour-color" name="hourColor" type="color" />
            </label>
            <label>
              Minute hand
              <input id="minute-color" name="minuteColor" type="color" />
            </label>
            <label>
              Second hand
              <input id="second-color" name="secondColor" type="color" />
            </label>
            <label>
              Hand thickness
              <input id="hand-width" name="handWidth" type="range" min="6" max="18" step="1" />
            </label>
            <label class="checkbox-label">
              <input id="smooth-seconds" name="smoothSeconds" type="checkbox" />
              Smooth second hand
            </label>
          </fieldset>

          <fieldset id="pendulum-settings" hidden>
            <legend>Pendulum</legend>
            <label>
              Pendulum color
              <input id="pendulum-color" name="pendulumColor" type="color" />
            </label>
            <label>
              Pendulum length
              <input
                id="pendulum-length"
                name="pendulumLength"
                type="range"
                min="60"
                max="140"
                step="5"
              />
            </label>
            <label>
              Pendulum bob
              <select id="pendulum-bob" name="pendulumBob">
                <option value="round">Round</option>
                <option value="oval">Oval</option>
                <option value="diamond">Diamond</option>
              </select>
            </label>
          </fieldset>

          <fieldset>
            <legend>Equation difficulty</legend>
            <label>
              Expression set
              <select id="difficulty" name="difficulty">
                <option value="simple">Simple</option>
                <option value="mixed">Mixed</option>
                <option value="advanced">Advanced</option>
              </select>
            </label>
          </fieldset>

          <div class="settings-actions">
            <button id="reset-button" class="secondary-button" type="button">Reset appearance</button>
            <button class="primary-button" type="submit">Save and close</button>
          </div>
        </form>

        <div class="install-help" id="ios-install-help" hidden>
          <strong>Install on iPhone or iPad</strong>
          <p>In Safari, tap Share, then choose <em>Add to Home Screen</em>.</p>
        </div>
      </aside>

      <section
        class="update-notification"
        id="update-notification"
        role="status"
        aria-live="polite"
        hidden
      >
        <p><strong>A new version is available:</strong></p>
        <div class="update-actions">
          <button class="primary-button" id="update-now-button" type="button">
            Update and Restart
          </button>
          <button class="secondary-button" id="update-later-button" type="button">Later</button>
        </div>
      </section>
    </main>
    <noscript>These clocks require JavaScript to show the current time.</noscript>
  </body>
</html>

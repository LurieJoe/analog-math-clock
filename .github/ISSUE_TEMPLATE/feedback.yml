name: Share feedback or an idea
description: Suggest a feature or tell us how Math Clock could improve.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Math Clock. Please do not attach a .mathclock backup or a private clock-face picture.
  - type: dropdown
    id: feedback-type
    attributes:
      label: What would you like to share?
      options:
        - A feature idea
        - An improvement to an existing feature
        - Feedback about the app or Help Center
        - Something else
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Tell us about your idea or feedback
      description: What would you like to see, and how would it help?
      placeholder: Describe your suggestion or feedback.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other details or screenshots that would help explain your suggestion.
